
---
- name: Configure Apache Web Servers
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    web_package: apache2
    web_service: apache2
    web_root: /var/www/html

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache
      apt:
        name: "{{ web_package }}"
        state: present

    - name: Ensure Apache is started and enabled
      service:
        name: "{{ web_service }}"
        state: started
        enabled: yes

    - name: Create custom index.html
      copy:
        dest: "{{ web_root }}/index.html"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Ansible Lab 4</title>
          </head>
          <body>
              <h1>Hello from Ansible Lab 4!</h1>
              <p>This web server is configured automatically by Ansible.</p>
          </body>
          </html>
        owner: root
        group: root
        mode: '0644'
